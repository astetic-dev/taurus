[package]
name = "taurus"
version = "0.1.4"
description = "Taurus - an agent launcher"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "taurus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"

# Windows-only: nodig om de WebView2 browser-accelerator-keys (F5, Ctrl+R,
# Ctrl+Shift+R, devtools) uit te zetten via een COM-call. Versies gepind op
# wat Tauri 2 al in de tree heeft, zodat er geen extra versie bijkomt.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

