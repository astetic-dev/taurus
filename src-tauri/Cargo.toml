[package]
name = "taurus"
version = "0.6.0"
description = "Taurus - an agent launcher"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "taurus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
# PNG-encoder om een geplakte klembord-afbeelding (RGBA uit clipboard-manager)
# als bestand in de input-map weg te schrijven. Klein, pure-Rust.
png = "0.17"
# Spraak: microfoon-opname (cpal) + WAV-schrijver (hound) voor push-to-talk
# STT; de transcriptie zelf draait out-of-process (sherpa-onnx sidecar).
cpal = "0.15"
hound = "3.5"
# Engine/model-archieven (.tar.bz2) zelf uitpakken: de Windows-systeem-tar is
# niet overal met bzip2 gebouwd (zlib-only bsdtar hangt/faalt er stil op).
tar = "0.4"
bzip2 = "0.4"
# SHA-256-verificatie van gedownloade STT-archieven (de engine is een exe die
# we uitvoeren; zonder checksum is een kwaadaardige registry-URL directe RCE).
sha2 = "0.10"
# Globale sneltoets (F9) voor push-to-talk, ook als het venster geen focus heeft.
tauri-plugin-global-shortcut = "2"

# Taurus als SSH-host (#121): dit werkstation bereikbaar maken zonder dat er een
# OpenSSH Server op hoeft, met de toestemming in de GUI.
# LET OP de features: russh kiest standaard aws-lc-rs, en die build BREEKT op
# Windows met "NASM command not found". Met ring bouwt het zonder extra
# toolchain. Niet terugzetten naar default-features bij een upgrade.
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
# De DROPZONE stuurt met scp.exe, en dat is sinds OpenSSH 9 een SFTP-client.
russh-sftp = "2.4"
rand = "0.10"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
# Machines vinden op het vertrouwde netwerk (#125). GEMETEN: 0.21 bouwt schoon op
# x86_64-pc-windows-msvc -- geen NASM, geen cmake, geen extra toolchain.
mdns-sd = "0.21"

# Windows-only: nodig om de WebView2 browser-accelerator-keys (F5, Ctrl+R,
# Ctrl+Shift+R, devtools) uit te zetten via een COM-call. Versies gepind op
# wat Tauri 2 al in de tree heeft, zodat er geen extra versie bijkomt.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Features voor het uitlezen van op het klembord gekopieerde bestanden (CF_HDROP)
# zodat "Plak object" ook een in Verkenner gekopieerd bestand aankan.
# JobObjects/Threading: sessies in een Job Object met kill-on-close, zodat de
# HELE procesboom (claude + MCP-servers) meegaat bij sluiten/crash (#77).
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  # Network List Manager: dezelfde bron als de Prive/Openbaar-vraag van Windows.
  # Geeft elk netwerk een stabiel GUID, zodat "vertrouw dit netwerk" iets
  # betekent dat een SSID-hernoeming overleeft (#121).
  "Win32_Networking_NetworkListManager",
  "Win32_System_Com",
  "Win32_System_Variant",
  # GetAdaptersAddresses: van het GUID van de adapter achter een vertrouwd netwerk
  # naar zijn IPv4-adres. Nodig om de mDNS-aankondiging aan ALLEEN die interface
  # te binden -- anders adverteert Taurus zijn Hyper-V- en WSL-interne ranges aan
  # de hele LAN (#125).
  "Win32_NetworkManagement_IpHelper",
  # GetAdaptersAddresses zit achter Ndis EN WinSock: het struct dat het teruggeeft
  # bevat velden uit allebei.
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }

